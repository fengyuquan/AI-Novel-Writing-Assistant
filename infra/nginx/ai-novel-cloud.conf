server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Align with server API_JSON_LIMIT (default 200mb) so full-book .txt knowledge uploads are not rejected at the gateway.
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    # 单用户访问门禁：浏览器会弹出登录框；账号密码在挂载的 .htpasswd 里
    auth_basic "AI Novel Private";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 把浏览器 basic auth 凭证继续带给上游（当前 API 未强制校验，预留）
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
